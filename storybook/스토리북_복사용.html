<style>
/* Layout: one reading column of page cards, sticky toolbar; each card copies its own text */
:root{

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

select,button{font:inherit;font-size:.9rem;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;min-height:40px}
select{flex:1 1 180px;min-width:0}

article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:140px;min-width:0}

article .text{font-family:var(--f-text);font-size:1.02rem;line-height:1.85;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;margin:0}
article button{flex:none;font-size:.85rem;min-height:36px;padding:6px 12px}
textarea.fallback{width:100%;min-height:160px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

<script>
const PAGES=[{"t": "01 · 속표지", "b": "KINGS DISTILLERY · YANGYANG\n\n좋은 술을 만들고 싶어,\n고추밭에 돌배나무부터 심었습니다\n\n김종환 · 손로지 부부의 20년"}, {"t": "02 · 서문 · 이 책은 양조장 소개가 아닙니다", "b": "술을 만들고 싶었습니다. 그래서 먼저 나무를 심었습니다.\n\n첫 열매를 따기까지 7년이 걸렸습니다.\n\n이 책은 양조장을 소개하는 책이 아닙니다. 한 잔의 술에서 시작해, 한 사람을 만나고, 한 집을 고쳐 짓기까지의 기록입니다.\n\n잘한 날보다 버틴 날이 더 많았습니다. 그 날들을 꾸미지 않고 적었습니다.\n\n이 이야기를 시작하게 한 그 한 잔에 대해, 저는 아직 어머니께 말씀드리지 못했습니다.\n\n그 이야기부터 하겠습니다."}, {"t": "03 · 목차", "b": "몰래 마신 한 잔에서, 아직 쓰는 중인 다음 장까지.\n\n서문 · 이 책은 양조장 소개가 아닙니다 · 02\n\n1부 · 20년 동안 아무에게도 말하지 않은 한 잔\n01 어머니는 아직도 모르신다, 그날 밤 내가 무엇을 열었는지 · 06\n02 고추밭에 나무를 심겠다는 아들, 부모님은 이유를 묻지 않았다 · 09\n03 포도잎 한 장으로 독일에서 일자리 제안을 받았다 · 11\n04 남들은 4년, 내 나무는 7년 · 13\n05 전국대회 우수상으로도 열지 못한 문 · 15\n06 산은 힘들었지만 쉬는 날이 많았다, 그 덕에 돌배밭을 지켰다 · 16\n\n2부 · 땅도 돈도 아니었다, 어머니가 딸에게 남긴 유산\n07 사진을 보고 딱 알아봤다, 내 사람이라고 · 18\n08 귀한 술을 받아 놓고, 아끼다 날려 버렸다 · 20\n09 네팔 잔치 상에는 막걸리 대신 무엇이 오를까 · 22\n10 산악인들이 \"마셔 봤다\"고 자랑하던 집 · 24\n11 \"누룩을 많이 넣지 마라\" 그다음은 비밀이다 · 27\n12 열두 살에 시작된 상속 · 29\n13 멀리 떨어져 있어도, 같은 방식으로 가양주를 빚고 있었다 · 31\n14 술을 멀리하던 사람이 우리 집 블렌드 마스터가 되기까지 · 32\n\n3부 · 크래프트는 술이 아니라, 건물부터였다\n15 모두가 말렸다, 단 한 사람만 빼고 · 36\n16 손님이 끊긴 약수매점을 고른 이유 · 38\n17 다 내 손으로 지었다, 딱 하나만 빼고 · 40\n18 하늘이 노래진 날, 길을 연 건 정화조였다 · 42\n19 2억짜리 꿈이 도착하고, 일주일 만에 멈췄다 · 44\n20 개업식 날, 재난문자가 울렸다 · 48\n\n4부 · 아직 쓰는 중인 이야기\n21 왕은 왜 가는 곳마다 돌배나무를 심었을까 · 51\n22 세 병은 세상에 나왔고, 두 병은 아직 숨어 있다 · 52\n23 2027년, 장모님의 증류기가 구룡령으로 온다 · 54\n24 다음 목적지는 세계다 · 55\n\n구룡령에서 보내는 편지 · 56\n연표 · 58"}, {"t": "04 · 한눈에 보는 20년", "b": "2005년 한 잔에서, 아직 쓰는 중인 다음 장까지.\n\n2005 · 몰래 연 술 한 병\n2006–07 · 고추밭 2,500평에 나무를 심다 · 산돌배 200그루\n2013 · 7년 만의 첫 열매\n2015–19 · 네팔 · 사진 한 장 · 두 번의 결혼식\n2022 · 산을 내려오다\n2023–25 · 한 집의 세 공간을 양조장으로 · 2025년 5월 개업\n2027 · 아직 쓰는 중\n\n첫 열매까지 7년.\n우리 부부는 아직 진행형이다."}, {"t": "05 · 1부 표지", "b": "20년 동안\n아무에게도 말하지 않은 한 잔\n\n2005 · 구룡령"}, {"t": "06 · 01 어머니는 아직도 모르신다, 그날 밤 내가 무엇을 열었는지 (1/3)", "b": "그 병이 어디에 있는지, 나는 알고 있었다.\n\n2005년, 구룡령 우리 집에는 서울에서 온 손님이 자주 머물렀다. 약국을 하시던 할아버지였다. 암 수술을 받고 몸을 회복하려고 오시는 길이었다. 한 번 오시면 한 달씩 지내다 가셨다.\n\n어느 날 할아버지가 어머니께 술 한 병을 건네셨다. 귀한 술이라고 하셨다.\n\n어머니가 그 병을 어디에 두시는지, 나는 봐 두었다.\n\n며칠 뒤 밤, 나는 그 병을 꺼냈다."}, {"t": "07 · 01 (2/3)", "b": "오래 세워 둔 병이었다. 마른 코르크가 열다가 부서졌다.\n\n한 모금에 놀랐다.\n\n와인과는 다른 맛이었다. 진하고 상쾌한 과일 향. 청포도 같기도 하고, 다래와 돌배 향도 나는 것 같았다. 조금 산화되어 신맛도 났다. 새콤하고, 달콤하고, 입안이 묵직했다.\n\n나는 와인을 좋아하지 않았다. 그런데 이 맛이라면 다시 마셔 보고 싶었다.\n\n아니, 만들어 보고 싶었다.\n\n그 술의 이름은 한참 뒤에야 알았다."}, {"t": "08 · 01 (3/3)", "b": "그 술이 아이스와인이라는 건, 교육을 받으면서 알게 되었다. 그 뒤로 여러 아이스와인을 맛보았다. 그날 밤의 맛과 같은 술은 없었다.\n\n그래도 그 맛은 잊히지 않았다.\n\n우리 땅의 과일로도 이런 술을 만들 수 있지 않을까.\n\n그날 이후 나는 술을 마시는 사람이 아니라, 술을 만들고 싶은 사람이 되었다.\n\n그런데 그날 밤의 일을, 나는 지금까지 한 번도 말씀드리지 못했다.\n\n아들이 왜 양조장을 하는지, 어머니는 아직도 모르신다.\n\n그 병은 원래, 어머니께 온 선물이었다."}, {"t": "09 · 02 고추밭에 나무를 심겠다는 아들, 부모님은 이유를 묻지 않았다 (1/2)", "b": "맛을 알았으니, 이제 배워야 했다.\n\n2006년, 양양군 농어촌관광대학 1기로 1년을 공부했다. 전국의 앞서가는 농촌을 찾아다녔다. 문경에서는 오미자 밭을 보고, 오미자로 빚은 술을 맛보았다. 일본에도 다녀왔다. 와인을 만드는 곳, 배와 포도를 키우는 곳을 직접 보았다.\n\n마지막 과제로 논문을 썼다. 제목은 「토종 와인 개발」이었다.\n\n그리고 같은 해, 부모님의 고추밭에 고추 대신 다른 것이 들어갔다."}, {"t": "10 · 02 (2/2)", "b": "2,500평이었다. 산머루 1,500평, 산다래 500평, 산돌배 500평. 산돌배는 그해 100그루를 심었다.\n\n고추가 자라던 밭이었다. 그 밭을 나무로 채우겠다는 아들에게, 부모님은 이유를 묻지 않으셨다. 반대도 하지 않으셨다. 밭을 내어주셨다.\n\n돌아보면, 그것은 응원이었다.\n\n언젠가 이 열매로 술을 빚겠다.\n\n그 '언젠가'가 얼마나 멀리 있는지, 그때는 몰랐다."}, {"t": "11 · 03 포도잎 한 장으로 독일에서 일자리 제안을 받았다 (1/2)", "b": "포도잎 한 장을 들여다봤을 뿐이었다.\n\n2007년, 강원도 미래농업대학 전문교육을 받았다. 3기 학생회장을 맡았다. 그리고 연수 프로그램으로 독일에 갔다. 그 술, 아이스와인의 나라였다.\n\n모젤 지역에서 한국 여성 한 분을 만났다. 독일 사람과 결혼해 체험장과 식당, 캠벨얼리 포도밭을 꾸리고 있었다.\n\n포도밭을 함께 걸었다. 나는 포도잎을 보고 어떤 병충해인지 짚었다. 맞았다.\n\n그분은 일손이 필요하다고 했다. 독일에 남아 2년만 같이 일해 보자고 했다."}, {"t": "12 · 03 (2/2)", "b": "구룡령에서 온 사람이 독일에서 일자리 제안을 받은 것이다.\n\n그런데 그 제안이, 나를 작게 만들었다.\n\n세상은 컸다. 내가 모르는 것이 너무 많았다. 나는 우물 안 개구리였다.\n\n나는 남지 않았다. 돌아와서 술을 만들어야 했다. 할 일이 너무 많았다.\n\n구룡령에서는 심어 둔 나무들이 자라고 있었다.\n\n그 나무들이 나를 얼마나 기다리게 할지, 그때는 몰랐다."}, {"t": "13 · 04 남들은 4년, 내 나무는 7년 (1/2)", "b": "보통 돌배나무는 4~5년이면 열매를 맺는다고 했다.\n\n나는 세 가지 나무 가운데 산돌배를 골랐다. 술에 담았을 때 향과 맛이 가장 좋았다. 산머루와 산다래를 정리하고 2,500평을 산돌배로 바꿨다. 2007년에 100그루를 더 심어 모두 200그루가 되었다. 일부는 다른 땅 500평으로 옮겨 심었다.\n\n꽃은 피었다. 열매는 달리지 않았다.\n\n물어볼 사람이 없었다. 돌배를 밭에 심은 사람은 동네에 나 하나였다.\n\n대신 묻는 사람은 많았다.\n\"왜 안 달리지?\"\n\n열리지 않는 나무는 베어 내고 다시 심었다. 다시 심는다는 것은, 다시 기다린다는 뜻이었다.\n\n그렇게 일곱 번째 봄이 왔다."}, {"t": "14 · 04 (2/2)", "b": "2013년. 가지마다 작은 열매가 달렸다. 노란 바구니에 첫 열매가 가득 찼다.\n\n그해 바로 술을 담갔다. 시중에서 파는 35도 담금주에 첫 돌배를 넣었다.\n\n맛이 좋았다. 향도 좋았다. 오래 걸렸지만, 가능성을 보았다.\n\n나는 그 술을 와인병에 나눠 담았다. 그리고 지인들에게 선물했다.\n\n2005년, 나는 남의 선물을 몰래 열었다.\n2013년, 내가 빚은 술을 선물로 건넸다.\n\n가능성은 보았다. 그런데 술을 빚어 팔 수 있는 양조장은, 아직 어디에도 없었다."}, {"t": "15 · 05 전국대회 우수상으로도 열지 못한 문", "b": "열매를 기다리는 7년 동안, 나는 다른 문도 두드리고 있었다.\n\n서리 맞은 산머루로 담근 술을 귀하게 여겼다는 옛이야기가 있다. 2007년, 구룡령 산머루로 아이스와인을 만들 수 있는지 실험했다. 가능하다는 결과를 논문으로 냈다. 전국 농업대학 경영자 대회에서 우수상을 받았다. 이듬해에는 강원대학교 농업 최고경영자 과정에서 우수논문상을 받았다.\n\n상장을 들고 국가 지원사업에 도전했다. 한 번이 아니었다. 공고 날짜가 바뀌고, 자격 기준이 바뀌었다. 문은 열리지 않았다.\n\n그래서 정했다.\n\n돈을 벌어서, 꼭 하겠다.\n\n2008년, 나는 산림청 등산안내인이 되었다. 술의 꿈은 가슴에 묻고, 산으로 갔다."}, {"t": "16 · 06 산은 힘들었지만 쉬는 날이 많았다, 그 덕에 돌배밭을 지켰다", "b": "설악산의 문은 세 번 떨어지고서야 2011년에 열렸다.\n\n고지대 근무는 일주일을 일하면 엿새쯤 쉬었다.\n\n산에서의 일은 힘들었다. 폭설 속에서 사람을 찾았다. 점봉산에서는 비바람에 젖어 저체온으로 죽을 고비를 넘겼다. 그날 살아 내려와서 다짐했다. 다시 얻은 삶이니, 평생 봉사하며 살겠다고.\n\n쉬는 엿새는 돌배밭에서 보냈다. 산에서 내려오면 밭으로 갔다.\n\n술은 가슴에 묻었지만, 나무는 놓지 않았다.\n\n그리고 점봉산에서 한 그 다짐이, 나를 산 너머로 데려갔다."}, {"t": "17 · 2부 표지", "b": "땅도 돈도 아니었다,\n어머니가 딸에게 남긴 유산\n\n2015 · 네팔"}, {"t": "18 · 07 사진을 보고 딱 알아봤다, 내 사람이라고 (1/2)", "b": "다짐은 국경을 넘었다.\n\n2015년 1월, 봉사단체 산내들희망캠프와 함께 네팔에 갔다. 오지마을 학교를 지원하는 일의 사무국장이었다. 그곳에서 처음 에베레스트를 보았다.\n\n몇 달 뒤 큰 지진이 났다. 우리가 지어 준 학교가 무너졌다. 다시 짓겠다고 약속했다.\n\n2017년, 선배들이 사진 한 장을 보여 주었다. 나와 잘 어울릴 것 같다고 했다. 착한 사람이라는 이야기도 들었다.\n\n얼굴은 아직 몰랐다."}, {"t": "19 · 07 (2/2)", "b": "2018년, 네팔에서 라이온스 국제행사가 열렸다. 나는 라이온스 국제이사님과 학교를 방문하는 일정을 맡았다. 그 행사의 관계자로, 그 사람이 있었다.\n\n사진 속 그 사람이었다.\n\n나는 딱 알아봤다. 내 사람이라고.\n\n2019년 2월, 고르카의 시리 사라다 학교가 다시 문을 열었다. 현판 맨 위에 이렇게 새겼다. DON'T GIVE UP. NEVER GIVE UP.\n\n그해 우리는 두 번 결혼했다. 5월에는 네팔에서, 11월에는 한국에서. 한국 결혼식에는 네팔의 가족들이 왔다. 장모님도 오셨다. 장모님이 한국에 오신, 단 한 번이었다.\n\n그때 나는 장모님에 대해 한 가지를 모르고 있었다."}, {"t": "20 · 08 귀한 술을 받아 놓고, 아끼다 날려 버렸다 (1/2)", "b": "결혼 전, 술 한 병을 받았다.\n\n장모님이 빚은 술이었다. 산악인들이 그 술을 무척 좋아한다고 했다.\n\n나는 그 병을 한국으로 가져왔다.\n\n그때 나는 독한 술을 잘 몰랐다. 맛있다는 말을 들었지만, 크게 마음을 두지 않았다.\n\n병은 그렇게 한쪽에 놓였다."}, {"t": "21 · 08 (2/2)", "b": "결혼하고 나서야 그 병을 열었다.\n\n장모님이 주신 술이라 아껴 두었다. 그사이 술은 조금씩 날아갔다. 따랐을 때, 제대로 된 맛을 볼 수 없었다.\n\n2005년의 그 병도 오래 세워 둔 술이었다. 코르크가 마르고, 술이 조금 변해 있었다. 이번에는 내가 아끼다가 그렇게 만들었다.\n\n장모님 술의 진가는 다른 사람들 덕분에 알았다. 네팔에서 한국으로 오는 사람들이 장모님의 술을 챙겨 왔다. 함께 잔을 나누며, 그 술의 이야기를 하나씩 들었다.\n\n그런데 이상했다. 네팔 사람들은 왜 집에서, 그것도 독한 술을 빚을까."}, {"t": "22 · 09 네팔 잔치 상에는 막걸리 대신 무엇이 오를까 (1/2)", "b": "가양주는 집에서 조금씩 빚는 술이다. 팔려고 만드는 술이 아니다. 집안에 일이 있을 때 쓰려고 빚는다.\n\n한국에서는 혼례가 있고, 제사가 있고, 잔치가 있으면 술이 있어야 했다. 손님을 맞는 집은 미리 술을 담갔다. 그 상에는 대개 막걸리가 올랐다.\n\n네팔도 같았다. 집안에 행사가 있거나 잔치가 열리면 술이 있어야 했다.\n\n다른 점이 하나 있었다."}, {"t": "23 · 09 (2/2)", "b": "네팔의 잔치 상에는 막걸리가 아니라 소주가 올랐다. 발효한 술을 한 번 더 내린 증류주, 럭시였다.\n\n지역마다 재료가 다르고 누룩이 다르다. 한국도 그렇다. 그래도 빚는 방식은 비슷했다.\n\n장모님의 술은 조금 달랐다.\n\n잔치 때만 빚는 술이 아니었다. 장모님은 늘 조금씩, 계속 술을 빚으셨다. 지인들에게, 그리고 산악인들에게 건넬 선물이었다.\n\n그 선물을 받는 사람들 중에는, 히말라야를 오르는 사람들이 있었다."}, {"t": "24 · 10 산악인들이 \"마셔 봤다\"고 자랑하던 집 (1/3)", "b": "아내의 둘째 언니는 네팔에서 여행사를 했다.\n\n언니는 히말라야를 찾은 한국 산악인들을 집으로 초대했다. 한국 음식을 차려 대접했다. 그 상에 장모님의 술이 올랐다.\n\n네팔 박타푸르의 한 집. 한국 음식과 네팔 술이 한 상에 놓였다.\n\n그 자리에서 장모님 술의 진가가 알려졌다. 이름만 대면 알 만한 산악인들도 그 술을 좋아했다고 한다.\n\n하지만 그 집의 문은 누구에게나 열리지 않았다."}, {"t": "25 · 10 (2/3) · 카피 페이지", "b": "장모님은 술을 아주 조금만 빚으셨다.\n누구에게나 내지 않으셨다.\n귀하게 모셔야 할 분들에게만, 선물로 건네셨다.\n\n마셔 봤다는 것은,\n귀한 대접을 받았다는 증표였다."}, {"t": "26 · 10 (3/3)", "b": "아내에게 장모님의 술이 다른 집 술과 무엇이 달랐는지 물었다. 아내는 부드럽고 향이 좋은 술이었다고 했다.\n\n나는 11년을 산에서 일했다. 산에서 사람을 찾았고, 산에서 죽을 고비도 넘겼다.\n\n그 산을 오르던 사람들이 귀하게 여기던 술이, 아내의 집에 있었다.\n\n산을 지키던 내가, 산사람들의 술을 만났다.\n\n그 술은 어떻게 만들어졌을까.\n\n답은 장모님의 부엌에 있었다."}, {"t": "27 · 11 \"누룩을 많이 넣지 마라\" 그다음은 비밀이다 (1/2)", "b": "장모님의 술은 쌀과 과일과 수수로 빚었다.\n\n누룩은 밀로 만들었다.\n\n재료에 누룩을 버무려 한 달쯤 발효했다. 그리고 그 술을 내렸다.\n\n술을 내리는 증류기는 구리와 흙으로 만든 것이었다. 금속과 흙을 함께 쓰는 전통 증류기다.\n\n이 증류기는 지금도 박타푸르에 있다."}, {"t": "28 · 11 (2/2)", "b": "장모님은 딸에게 술을 가르치며 이렇게 말했다.\n\n\"밥이 급해도, 완전히 식혀서 누룩을 넣고 버무려라.\"\n\n\"누룩을 많이 넣지 마라.\"\n\n여기까지가 아내가 들려준 말이다.\n\n그 이상은, 비밀이라고 했다."}, {"t": "29 · 12 열두 살에 시작된 상속 (1/2)", "b": "아내가 어머니께 술을 배우기 시작한 것은 열두 살 때였다.\n\n어머니 곁에서 밥을 식히고, 누룩을 버무렸다. 아내에게 술은 공부해서 아는 것이 아니었다. 손에 익은 것이었다.\n\n나는 농업대학에서, 독일의 포도밭에서 술을 배웠다.\n아내는 어머니의 부엌에서 술을 익혔다.\n\n나는 술을 배웠고, 아내는 술을 익혔다."}, {"t": "30 · 12 (2/2)", "b": "부모가 자식에게 물려주는 것은 대개 땅이거나 돈이다.\n\n장모님이 딸에게 남긴 것은 둘 다 아니었다. 술 빚는 손이었다. 그리고 그 손이 기억하는 감각이었다.\n\n이제 장모님은 곁에 계시지 않는다.\n\n장모님의 증류기만 박타푸르에 남아 있다.\n\n그 증류기를 어떻게 할지, 우리는 이미 정해 두었다."}, {"t": "31 · 13 멀리 떨어져 있어도, 같은 방식으로 가양주를 빚고 있었다", "b": "아내의 집에서 술을 빚는 방식을 알고 놀랐다. 누룩을 쓰는 법도, 술을 만드는 과정도 우리와 같았다.\n\n박타푸르, 장모님 · 구룡령, 킹스양조장\n재료 · 쌀, 과일, 수수 · 쌀, 옥수수, 돌배\n누룩 · 밀누룩 · 전통 누룩\n발효 · 한 달 정도 ·\n내리기 · 구리와 흙의 증류기 · 증류기, 소줏고리 연구\n건네는 곳 · 귀한 분께 드리는 선물 · 누군가에게 건네는 한 병\n\n멀리 떨어진 두 부엌이, 같은 방식으로 술을 빚고 있었다.\n\n그리고 지금, 그 방식을 아는 사람이 구룡령에 있다."}, {"t": "32 · 14 술을 멀리하던 사람이 우리 집 블렌드 마스터가 되기까지 (1/2)", "b": "아내는 조심성이 많은 사람이다. 먼저 나서서 자랑하지 않는다. 나와는 정반대다. 결혼 전 집안의 술 이야기를 잘 몰랐던 것도 그래서였을 것이다.\n\n열두 살에 누룩을 버무리던 딸은, 한동안 술을 멀리했다.\n\n아내가 한 말이 있다.\n\n\"옛날에는 술이 좋지 않다고 생각했어요. 사람들이 술을 지나치게 마시는 모습을 많이 봤거든요. 그런데 한국에 와서 남편이 돌배로 술을 빚는 모습을 곁에서 지켜보고, 그 맛을 알게 되면서, 술을 다시 보게 됐어요.\"\n\n지금 킹스양조장의 술은 모두 그 사람의 손을 거쳐 나간다."}, {"t": "33 · 14 (2/2)", "b": "블렌딩을 한다. 병에 담는다. 포장을 한다. 마지막으로 확인한다.\n\n금배주도, 봉신설주도, 설락소주도 그 손을 거쳐야 세상에 나간다.\n\n아내는 미각이 뛰어나다. 나는 아내를 우리 양조장의 블렌드 마스터로 인정한다.\n\n열두 살의 부엌에서 시작된 손이, 구룡령에서 술을 완성하고 있다.\n\n나는 술을 빚고, 아내는 술을 완성한다."}, {"t": "34 · 장모님", "b": "\"누룩을 많이 넣지 마라.\""}, {"t": "35 · 3부 표지", "b": "크래프트는 술이 아니라,\n건물부터였다\n\n2023년 1월 — 2025년 5월"}, {"t": "36 · 15 모두가 말렸다, 단 한 사람만 빼고 (1/2)", "b": "설악산에서 11년을 일했다.\n\n결혼하고 나서 국립공원의 배려로 백담분소로 옮겼다. 집에서 출퇴근할 수 있었다. 그렇게 3년을 다녔다.\n\n코로나가 왔다. 아내는 밖에 나가지 못하고, 집에서 나를 기다렸다.\n\n그러다 고지대로 발령이 났다. 양폭대피소였다. 한 번 올라가면 닷새는 아내 혼자 지내야 했다. 낯선 나라의 낯선 집에서.\n\n산보다 지켜야 할 사람이 생겼다."}, {"t": "37 · 15 (2/2)", "b": "산을 내려가겠다고 하자 주변에서 말렸다.\n\n\"정신 있는 놈이냐?\"\n\"왜 잘 다니던 직장을 그만둬?\"\n\"책임감은 있는 거야?\"\n\n모두가 말렸다. 한 사람만 빼고.\n\n2008년에 \"돈을 벌어서 꼭 하겠다\"며 묻어 둔 꿈이 있었다. 그 꿈을 꺼냈을 때, 아내는 흔쾌히 허락했다.\n\n2022년, 나는 산을 내려왔다.\n\n남은 문제는 두 가지였다. 어디서, 무엇으로."}, {"t": "38 · 16 손님이 끊긴 약수매점을 고른 이유 (1/2)", "b": "새 땅을 살 돈은 없었다.\n\n구룡령에 한 지붕 아래 세 공간이 붙은 집이 있었다. 약수매점, 내가 쓰던 방, 그리고 민박집 방.\n\n약수매점은 손님이 끊긴 지 오래였다. 내 방은 결혼하고 이사한 뒤, 부모님 댁에 갈 때 한 번씩 자고 오는 방이 되어 있었다.\n\n그 세 공간을 하나로 터서 양조장을 만들기로 했다.\n\n있는 것에서 시작하기로 했다."}, {"t": "39 · 16 (2/2)", "b": "사람을 쓸 수도 없었다.\n\n비용도 비쌌지만, 양양에서 28km 떨어진 구룡령까지 일하러 오겠다는 사람이 없었다. 온다 해도 5만 원, 10만 원을 더 달라고 했다. 멀다며 거절하기도 했다.\n\n남은 방법은 하나였다. 아내와 둘이서, 우리 손으로.\n\n2023년 1월, 철거부터 시작했다.\n\n문제가 하나 있었다. 나는 용접을 배운 적이 없었다."}, {"t": "40 · 17 다 내 손으로 지었다, 딱 하나만 빼고 (1/2)", "b": "동영상을 보고 장비를 샀다. 이틀 연습했다. 그리고 바로 실전에 들어갔다.\n\n볼품은 없었다. 그래도 붙었다.\n\n벽돌을 쌓을 때는 기초를 두고 아내와 맞섰다. 서로 자기 방식이 맞다고 했다. 결론은 내 패배였다. 아내의 방식이 더 지혜로웠다.\n\n크게 싸운 적은 없다. 사소하게 다툰 적은 셀 수 없이 많다.\n\n벽돌을 쌓고, 페인트를 칠하고, 새시를 만들고, 창문을 달았다.\n\n하나부터 열까지 우리 손으로 지었다. 딱 하나만 빼고."}, {"t": "41 · 17 (2/2)", "b": "화장실 타일이었다.\n\n내가 직접 깔았다. 도저히 쓸 수가 없었다. 결국 전문가를 불렀다. 그분이 내 타일 위에 다시 타일을 깔았다.\n\n지금도 그 화장실 바닥 아래에는, 내가 깐 타일이 그대로 있다.\n\n타일은 다시 깔면 됐다.\n\n가장 높은 벽은 따로 있었다."}, {"t": "42 · 18 하늘이 노래진 날, 길을 연 건 정화조였다 (1/2)", "b": "허가였다.\n\n구룡령은 최상류 지역이다. 양조장에서 나오는 오폐수를 어떻게 처리하느냐가 가장 큰 문제였다. 그 문제 하나에 1년 가까이 걸렸다. 양조장은 못 한다는 이야기까지 나왔다.\n\n벽돌은 쌓으면 되고, 타일은 다시 깔면 됐다. 이 벽은 손으로 넘을 수 있는 벽이 아니었다.\n\n하늘이 노랗게 보였다.\n\n길은 생각지 못한 곳에서 열렸다."}, {"t": "43 · 18 (2/2)", "b": "주변 사람들이 도와주었다. 특히 정화조를 설치하는 선배님 덕분에 가장 큰 문제를 풀었다.\n\n허가가 났다.\n\n이제야 양조장을 할 수 있겠구나. 세상을 다 얻은 기분이었다.\n\n그것은 또 다른 고생의 시작이었다."}, {"t": "44 · 19 2억짜리 꿈이 도착하고, 일주일 만에 멈췄다 (1/2)", "b": "첫 설비가 하나씩 들어왔다. 내 돈으로 산, 2억 원 가까운 설비였다.\n\n2005년의 한 잔에서 시작된 시간이, 기계가 되어 들어왔다.\n\n설비가 들어온 날, 나는 꿈이 이루어졌다고 느꼈다.\n\n몰랐던 것이 있었다. 그 모든 설비를 익히고, 분해하고, 다시 조립해야 한다는 것을.\n\n그 꿈이 멈추는 데는 일주일이면 충분했다."}, {"t": "45 · 19 (2/2)", "b": "작동한 지 일주일 만에 비싼 일본산 감압펌프가 고장 났다.\n\n나는 원래 기계를 만지면 조립을 못 하는 사람이다. 그런데 해야만 했다. 못하는 것을 하려니 고생이 두 배였다.\n\n그래도 어떻게든 고쳤다.\n\n첫 술을 내렸다. 감흥은 없었다. 2013년부터 술을 빚어 온 사람에게, 양조장의 첫 술은 시작이 아니었다.\n\n이어지는 하루였다."}, {"t": "46–47 · BEFORE / AFTER", "b": "한 집의 세 공간이, 하나의 양조장이 되었다."}, {"t": "48 · 20 개업식 날, 재난문자가 울렸다 (1/2)", "b": "2025년 5월, 개업식 날이었다.\n\n200명이 넘는 분들이 오셨다. 가족과 친척, 친구, 옛 동료와 지인들. 설악산에서 함께 일한 산악구조대원들도, 양양군 119구조대원들과 대장님도 오셨다. 아내의 외국 친구들도 왔다.\n\n그날 인제에서 산불이 났다.\n\n서울양양고속도로가 통제되었다. 양조장에도 대피하라는 재난문자가 왔다.\n\n그 자리에는, 산과 불을 가장 잘 아는 사람들이 손님으로 앉아 있었다."}, {"t": "49 · 20 (2/2)", "b": "다행히 불은 이쪽으로 번지지 않았다. 오신 분들은 모두 무사히 돌아가셨다.\n\n개업식 날 큰불이 났으니 대박이 날 거라고, 사람들은 말했다.\n\n가족들이 서빙을 하고 음식을 날랐다. 멀리 광양에서 작은삼촌과 사촌동생들까지 왔다. 아내는 응원하러 온 지인들 사이에서 정신없이 하루를 보냈다.\n\n둘이서 지은 양조장이, 그날은 모두의 손으로 문을 열었다.\n\n몰래 마신 한 잔에서, 꼭 20년이었다."}, {"t": "50 · 우리 손으로 지은 집", "b": "나 혼자였다면, 절대 못 했을 일이다."}, {"t": "51 · 4부 표지 + 21 왕은 왜 가는 곳마다 돌배나무를 심었을까", "b": "아직 쓰는 중인 이야기\n\n술에 담을 돌배의 이야기를 찾다가, 태조 이성계를 만났다.\n\n그는 가는 곳마다 돌배나무를 심었다고 전해진다. 진안 마이산 은수사에는 650년이 넘은 청실배나무가 있다. 이성계가 왕이 되는 꿈을 꾸고 그 증표로 심었다고 전해지는 나무다.\n\n내가 구룡령에 심은 나무도 돌배나무였다.\n\n1418년, 세종이 즉위하던 해의 기록에서 이야기 하나를 더 만났다. 첫눈은 귀한 사람에게만 전해지던 봉인된 선물이었다.\n\n그 이름을 담은 술이 봉신설주다.\n\n왕에게 올리던 선물. 산악인에게 건네던 장모님의 선물. 그 사이에 세 병의 술이 있다."}, {"t": "52 · 22 세 병은 세상에 나왔고, 두 병은 아직 숨어 있다 (1/2)", "b": "2006년에 심은 나무가 술이 되었다.\n\n금배주. 강원도 자색옥수수를 발효하고 증류해 바탕을 만들었다. 거기에 돌배를 발효해 얻은 추출물을 더했다. 소고기와 어울리도록 맞춘 술이다.\n\n설락소주. 옥수수와 쌀을 발효해 증류했다. 17도와 25도로 빚는다.\n\n봉신설주. 돌배를 발효해 증류하고, 다시 돌배로 침출했다. 처음부터 끝까지 돌배로만 만든 술이다. 7년을 기다린 그 나무의 열매다.\n\n처음 세상에 내놓았을 때, 와디즈 전통주 부문 첫 펀딩으로 12,003%를 기록했다. 전체 1위였다.\n\n그리고 아직 세상에 나오지 않은 두 병이 있다."}, {"t": "53 · 22 (2/2)", "b": "대감소주와 마님소주. 돌배를 증류한 소주다. 대감소주는 40도, 마님소주는 25도. 누룩으로 빚는 술로 연구하고 있다. 2027년 하반기가 목표다.\n\n상을 받았느냐고 사람들이 묻는다.\n\n아직 하나도 없다. 대회에 나가지 않았다. 부스 행사에도 서지 않았다. 한국에서는 서둘러 알리기보다, 천천히 퍼지기를 바랐다.\n\n7년을 기다려 첫 열매를 딴 사람에게, 서두를 이유는 없었다.\n\n이제 천천히 준비하고 있다.\n\n몰래 마신 한 잔이, 이제 누군가의 한 잔이 되었다."}, {"t": "54 · 23 2027년, 장모님의 증류기가 구룡령으로 온다", "b": "박타푸르에 있는 그 증류기 이야기를 해야겠다.\n\n2027년, 우리는 장모님의 증류기를 구룡령으로 가져온다.\n\n장모님이 누룩을 만들던 법, 술을 내리던 법, 구리와 흙을 함께 쓰는 증류기의 구조. 그것을 이 땅에서 다시 살려 내려 한다. 아직은 연구 중이다.\n\n\"누룩을 많이 넣지 마라.\"\n\n그다음은 여전히 비밀이다.\n\n그 비밀이 구룡령에서 한 병의 술이 되는 날, 이 책의 다음 장이 시작된다."}, {"t": "55 · 24 다음 목적지는 세계다", "b": "\"한국에서도 아직 인정받지 못했는데, 무슨 세계냐.\"\n\n이 질문에 대한 내 답은 단순하다. 처음부터 목표는 수출이었다. 20년 전부터 준비했다.\n\n오크통이 아니라 술항아리로 숙성한다. 한국의 방식으로 선다.\n\n아이스와인의 나라 독일. 증류주의 나라 스코틀랜드와 일본. 블루콘 위스키의 미국. 가서 보고, 배우고, 킹스의 술을 알리고 싶다.\n\n박타푸르와 구룡령의 두 부엌은 같은 방식으로 술을 빚었다. 어쩌면 술의 뿌리는 하나일지도 모른다. 세계의 양조장을 찾아가는 길은 그 뿌리를 찾는 길이다.\n\n2005년, 몰래 마신 한 잔이 나를 독일로 데려갔다.\n\n이번에는 우리가 빚은 한 잔을 들고 간다. 혼자가 아니다."}, {"t": "56 · 구룡령에서 보내는 편지 (1/2)", "b": "끝까지 읽어 주셔서 고맙습니다.\n\n이 책을 쓰며 20년을 다시 걸었습니다. 고추밭에 묘목을 심던 봄, 꽃만 피던 여름들, 설악의 겨울, 박타푸르의 부엌, 그리고 둘이서 벽돌을 쌓던 2년 4개월.\n\n나무는 남들보다 3년 늦게 열렸습니다. 산의 문은 세 번 떨어지고서야 열렸습니다. 양조장은 동영상으로 배운 용접으로 지었고, 화장실 타일은 끝내 실패했습니다.\n\n술은 서두르면 거칠어지고, 기다리면 둥글어집니다.\n\n혹시 지금 늦게 열리는 나무 앞에 서 계신다면, 조금만 더 기다려 보시길 바랍니다. 늦게 열릴 뿐, 열리지 않는 것이 아닙니다.\n\n김종환 — 나무를 심는 일도, 술을 빚는 일도 결국 기다리는 일이었습니다.\n\n손로지 — 술을 멀리하던 제가 이제 우리 술을 완성합니다. 사람의 마음도 술처럼 천천히 익는다는 것을 배웠습니다."}, {"t": "57 · 구룡령에서 보내는 편지 (2/2) · 어머니께", "b": "어머니는 오늘도 양조장 걱정, 제 건강 걱정을 하십니다.\n\n그 마음을 모르지 않으면서, 저는 \"알았어요, 잘할게요\"보다 화를 먼저 냅니다. 고쳐야 할 습관인 줄 알면서도 잘 고쳐지지 않습니다.\n\n그래서 말 대신 결과로 보여 드리려 합니다. 양조장이 하루빨리 자리를 잡는 것이 걱정을 덜어 드리는 길이라고 믿습니다.\n\n마음으로는 늘 감사합니다. 고추밭을 아무것도 묻지 않고 내어주셨던 그날부터, 지금까지.\n\n2005년, 할아버지가 어머니께 드린 그 술을 제가 몰래 열었습니다.\n\n어머니, 이 책으로 처음 말씀드립니다.\n\n제가 왜 양조장을 하는지.\n\n2026년 가을, 구룡령에서\n김종환 · 손로지"}, {"t": "58 · 연표 2005 — 2027", "b": "2005 · 약국 할아버지가 어머니께 선물한 아이스와인을 몰래 맛보다\n2006 · 양양군 농어촌관광대학 1기, 「토종 와인 개발」 논문 / 고추밭 2,500평에 산머루·산다래·산돌배, 산돌배 100그루\n2007 · 강원도 미래농업대학 3기 학생회장 / 독일 모젤 연수 / 산머루 아이스와인 실험 논문, 전국 농업대학 경영자 대회 우수상 / 산돌배 100그루 추가, 모두 200그루\n2008 · 강원대학교 농업 최고경영자 과정 우수논문상 / 산림청 등산안내인\n2011 · 세 번의 낙방 끝에 설악산으로\n2013 · 7년 만의 첫 열매, 첫 술을 와인병에 담아 선물\n2015 · 네팔 오지마을 학교 지원 / 대지진으로 학교 붕괴\n2017 · 사진 한 장\n2018 · 라이온스 국제행사에서 첫 만남 / 학교 재건 공사 시작\n2019 · 2월 시리 사라다 학교 준공 / 5월 네팔 결혼식, 11월 한국 결혼식\n2022 · 설악산 11년을 마치고 산을 내려오다\n2023 · 1월, 한 집의 세 공간을 양조장으로. 부부가 직접 공사\n2025 · 5월, 킹스양조장 개업\n\n2027 · 장모님의 증류기, 구룡령으로 / 대감소주·마님소주"}, {"t": "59 · 다음 장은 아직 쓰는 중입니다", "b": "다음 장은\n아직 쓰는 중입니다.\n\n2005년, 어머니께 온 선물 한 병.\n2013년, 와인병에 담아 건넨 첫 술.\n박타푸르, 귀한 손님에게만 건네던 장모님의 술.\n\n돌아보니 이 이야기는 처음부터,\n누군가에게 건네는 한 병이었다."}, {"t": "60 · 판권면", "b": "좋은 술을 만들고 싶어, 고추밭에 돌배나무부터 심었습니다\n김종환 · 손로지 부부의 20년\n\n초판 발행 2026년 ○월 ○일\n지은이 김종환 · 손로지\n펴낸곳 농업회사법인 킹스(주)\n사진 킹스양조장"}];

PAGES.forEach((p,i)=>{
  const a=document.createElement('article');a.id='p'+i;
  const h=document.createElement('div');h.className='head';
  const t=document.createElement('h2');t.textContent=p.t;
  const b=document.createElement('button');b.type='button';b.textContent='복사';
  b.addEventListener('click',()=>copy(p.b,b,a));
  h.append(t,b);
  const x=document.createElement('p');x.className='text';x.textContent=p.b;
  a.append(h,x);list.append(a);
});
function copy(text,btn,host){
  const ok=()=>{const o=btn.textContent;btn.textContent='복사됨';btn.classList.add('done');setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1500)};
  const fb=()=>{let ta=host.querySelector('textarea.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';ta.readOnly=true;host.append(ta)}ta.value=text;ta.focus();ta.select();btn.textContent='선택됨, 길게 눌러 복사'};
  try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
}
document.getElementById('all').addEventListener('click',e=>{
  const t=PAGES.map(p=>'['+p.t+']\n\n'+p.b).join('\n\n────────────\n\n');
  copy(t,e.currentTarget,document.querySelector('header.top'));
});
document.getElementById('jump').addEventListener('change',e=>{document.getElementById(e.target.value).scrollIntoView({behavior:'smooth'})});
</script>
