<!-- ===== 봉신설주 WINTER SIGNAL · 와디즈 바로가기 (아임웹 붙여넣기용) =====
     바꿀 곳 2곳: [와디즈주소] · [봉신설주사진주소] (세로 사진, 없으면 해당 줄의 style 속성을 지우면 글만 보임)
     눈 내리는 효과는 스크립트 없이 동작 · 모든 이름 kw- -->
<style>
  .kw { --navy:#151D2E; --snow:#F4F2EC; --silver:#C9CFD8; --wadiz:#00C4C4;
        position: relative; overflow: hidden; min-height: 88vh; display: grid; place-items: center; padding: 96px 24px;
        background: radial-gradient(ellipse 70% 60% at 70% 0%, #2B3A58, var(--navy) 70%); color: var(--snow);
        font-family: Pretendard, "Noto Sans KR", sans-serif; word-break: keep-all; }
  .kw * { box-sizing: border-box; }
  /* 눈: 크기가 다른 눈송이 세 겹이 다른 속도로 내림 */
  .kw::before, .kw::after, .kw-snow { content: ""; position: absolute; inset: -100% 0 0 0; pointer-events: none; }
  .kw::before { background-image: radial-gradient(2px 2px at 10% 20%, #fff, transparent), radial-gradient(2px 2px at 30% 60%, #fff, transparent), radial-gradient(1.5px 1.5px at 55% 35%, #fff, transparent), radial-gradient(2px 2px at 75% 75%, #fff, transparent), radial-gradient(1.5px 1.5px at 90% 15%, #fff, transparent);
                background-size: 320px 320px; opacity: .55; animation: kw-fall 26s linear infinite; }
  .kw::after  { background-image: radial-gradient(3px 3px at 20% 40%, #fff, transparent), radial-gradient(2.5px 2.5px at 60% 10%, #fff, transparent), radial-gradient(3px 3px at 85% 55%, #fff, transparent);
                background-size: 460px 460px; opacity: .7; animation: kw-fall 18s linear infinite; }
  .kw-snow    { background-image: radial-gradient(4px 4px at 40% 30%, rgba(255,255,255,.9), transparent), radial-gradient(3.5px 3.5px at 80% 80%, rgba(255,255,255,.85), transparent);
                background-size: 620px 620px; filter: blur(.6px); animation: kw-fall 12s linear infinite; }
  @keyframes kw-fall { to { transform: translateY(50%); } }
  @media (prefers-reduced-motion: reduce) { .kw::before, .kw::after, .kw-snow { animation: none; } }

  .kw-in { position: relative; z-index: 1; width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; }
  .kw-signal { display: inline-block; margin: 0; font: 600 12px/1 Pretendard, sans-serif; letter-spacing: .36em; color: var(--silver); border-left: 2px solid var(--silver); padding: 2px 0 2px 12px; }
  .kw-title { font: 600 clamp(40px, 6vw, 72px)/1.2 "Noto Serif KR", serif; letter-spacing: -.02em; margin: 26px 0 10px; color: #fff; }
  .kw-hook { font: 500 clamp(26px, 3.4vw, 40px)/1.35 "Noto Serif KR", serif; margin: 0 0 36px; color: var(--silver); }
  .kw-open { margin: 0 0 18px; font-size: 17px; color: var(--snow); }
  .kw-open b { color: #fff; }
  .kw-btn { display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 30px; border-radius: 6px; background: var(--wadiz); color: #fff !important; text-decoration: none !important; font: 700 17px/1 Pretendard, sans-serif; transition: transform .15s, background .2s; }
  .kw-btn:hover { background: #00b0b0; transform: translateY(-1px); }
  .kw-btn::before { content: "W"; font: 800 13px/1 Pretendard, sans-serif; width: 22px; height: 22px; border-radius: 4px; background: #fff; color: var(--wadiz); display: inline-grid; place-items: center; }
  .kw-limited { display: flex; align-items: center; gap: 12px; margin: 26px 0 0; font: 500 15px/1 "Noto Serif KR", serif; color: var(--silver); letter-spacing: .04em; }
  .kw-limited::before { content: ""; width: 36px; height: 1px; background: var(--silver); }
  .kw-note { margin: 22px 0 0; font-size: 12.5px; color: #8E98AA; }
  .kw-bottle { justify-self: center; width: min(360px, 80vw); aspect-ratio: 3 / 4; border-radius: 999px 999px 6px 6px; border: 1px solid rgba(201,207,216,.5);
               background: rgba(255,255,255,.04) center / cover no-repeat; box-shadow: 0 30px 70px rgba(0,0,0,.45); }
  @media (max-width: 860px) {
    .kw { min-height: 0; padding: 72px 22px 80px; }
    .kw-in { grid-template-columns: 1fr; gap: 40px; text-align: center; }
    .kw-bottle { order: -1; width: 62vw; }
    .kw-limited { justify-content: center; }
    .kw-btn { width: 100%; justify-content: center; }
  }
</style>

<section class="kw" aria-labelledby="kw-title">
  <span class="kw-snow" aria-hidden="true"></span>
  <div class="kw-in">
    <div>
      <p class="kw-signal">WINTER SIGNAL</p>
      <h2 class="kw-title" id="kw-title">첫눈이 온다고요?</h2>
      <p class="kw-hook">봉신설주를 여세요.</p>
      <p class="kw-open">봉신설주 17° · <b>11월 1일 와디즈 OPEN</b></p>
      <a class="kw-btn" href="[와디즈주소]" target="_blank" rel="noopener">오픈 알림 신청하기</a>
      <p class="kw-limited">2026년 한정판 · 1,500병</p>
      <p class="kw-note">만 19세 이상 펀딩 참여 가능 · 지나친 음주는 건강을 해칩니다.</p>
    </div>
    <div class="kw-bottle" role="img" aria-label="봉신설주 17도" style="background-image:url('[봉신설주사진주소]')"></div>
  </div>
</section>
